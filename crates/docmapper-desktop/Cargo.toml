[package]
name = "docmapper-desktop"
description = "DocMapper desktop shell: wires the adapters to the core and exposes its commands"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "docmapper_desktop"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
docmapper-core.workspace = true
docmapper-sqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"

[dev-dependencies]
rusqlite = "0.41"
tempfile = "3"

[lints]
workspace = true
